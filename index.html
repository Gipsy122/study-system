<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Discipline System | Liquid Glass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    
    <main class="app-container">
        <header class="master-panel glass-card">
            <h1>Master Break Pool</h1>
            <div class="master-timer" id="master-clock">210:00</div>
            <p class="status-text" id="system-status">System Standing By</p>
            <div class="admin-only" id="global-controls">
                <button class="btn btn-danger" onclick="system.resetDay()">Restart Day</button>
            </div>
        </header>

        <section class="timer-grid" id="timer-container">
            </section>

        <section class="coupon-area">
            <div class="glass-card">
                <h2>Active Rewards</h2>
                <div id="coupon-list" class="coupon-grid"></div>
                
                <div class="admin-only coupon-creator">
                    <h3>Issue Coupon</h3>
                    <input type="text" id="cpn-name" placeholder="Coupon Name">
                    <input type="number" id="cpn-value" placeholder="Minutes">
                    <button class="btn btn-primary" onclick="system.createCoupon()">Issue</button>
                </div>
            </div>
        </section>

        <section class="log-section glass-card">
            <h3>Activity Log</h3>
            <div id="activity-log" class="logs"></div>
        </section>
    </main>
